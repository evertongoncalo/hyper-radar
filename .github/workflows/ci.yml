name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seguranca:
    name: Auditoria de dependências e verificação de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Só dependências de produção; falha com vulnerabilidades altas ou críticas.
      - name: Auditoria (npm audit)
        run: npm audit --omit=dev --audit-level=high

      # Script próprio, sem dependências: não precisa de npm ci.
      - name: Verificação de segredos
        run: npm run verificar:segredos

  verificar:
    name: Lint, formatação, tipos, testes e build
    runs-on: ubuntu-latest
    # Postgres descartável para os testes de integração das migrações.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hyperradar
          POSTGRES_PASSWORD: hyperradar
          POSTGRES_DB: hyperradar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hyperradar -d hyperradar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Verificação de tipos
        run: npm run typecheck

      - name: Testes e cobertura
        run: npm run test:coverage
        env:
          TEST_DATABASE_URL: postgres://hyperradar:hyperradar@127.0.0.1:5432/hyperradar_test

      - name: Build
        run: npm run build
